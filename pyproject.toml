[project]
name = "retention"
version = "0.1.0"
description = "Customer retention ML platform: predicts which customers are likely to cancel, end to end (data, training, tracking, serving, monitoring, retraining)."
readme = "README.md"
authors = [
    { name = "RAFIUL86", email = "rafiulhasan86@gmail.com" }
]
requires-python = ">=3.12"
# Core = what serving needs (the API image installs only these). Training, the pipeline and dev tools
# are dependency groups below; `uv sync` installs them all locally (see [tool.uv] default-groups).
dependencies = [
    "fastapi==0.143.0",
    "mlflow-skinny==3.16.1",  # the MLflow client (registry, model loading); the server runs in Docker
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pandera[pandas]==0.34.1",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "skops==0.16.0",  # how MLflow saves our scikit-learn models (safer than pickle)
    "uvicorn==0.54.0",
]

[project.scripts]
retention = "retention:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]  # >= the uv pinned in infra/api/Dockerfile
build-backend = "uv_build"

[dependency-groups]
training = [
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "optuna==5.0.0",
    "shap==0.53.0",
    # Same version on both platforms. On Linux the CPU-only build: the default one bundles 350 MB of
    # NVIDIA GPU libraries we never use (training runs on CPU).
    "xgboost==3.4.1; sys_platform == 'darwin'",
    "xgboost-cpu==3.4.1; sys_platform == 'linux'",
]
pipeline = [
    "boto3==1.43.75",  # call lists to S3 on AWS (the newest compatible with DVC's S3 plugin)
    "prefect==3.8.8",
]
dev = [
    "mlflow==3.16.1",  # full MLflow: the tests use its local SQLite tracking store
    "ipykernel==7.4.0",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "dvc[s3]==3.67.1",
]
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]   # errors, pyflakes, import order, bugbear, modern syntax, simplify

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside MLflow 3.16's own SQLAlchemy models, not our code.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    # Raised inside shap 0.52's colour maps on import, not our code.
    "ignore::PendingDeprecationWarning:shap.plots.colors._colors",
    # Raised by Prefect 3.8's own database types under SQLAlchemy 2.1, not our code.
    "ignore:Type object <class 'prefect.server.utilities.database:DeprecationWarning",
    # FastAPI 0.141's test client import, not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.uv]
default-groups = ["training", "pipeline", "dev"]
# Dependency cooldown: ignore anything published after this date (at least two weeks old when set),
# so a freshly compromised or broken release can't slip in. Move it forward deliberately.
exclude-newer = "14 days"
# Where this runs: Apple-silicon Macs (development) and Linux (CI, Docker, AWS).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]
# Pins for transitive dependencies we don't import directly (versions at least two weeks old).
constraint-dependencies = ["numba==0.67.0"]
