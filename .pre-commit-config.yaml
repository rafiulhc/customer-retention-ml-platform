repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0          # same version as the ruff in uv.lock, so editor, pre-commit and CI agree
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files   # stops datasets or models being committed by accident
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
