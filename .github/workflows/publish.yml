# Build the three images for AWS (arm64, for Graviton) and push them to ECR with one immutable tag.
# Manual on purpose: the AWS environment exists only while a demo runs (see docs/deployment.md).
# Authentication is OIDC: GitHub proves who it is to AWS, and AWS hands out credentials valid for one
# hour. No AWS keys are stored in GitHub. Rolling the images out is `terraform apply` (image_tags).
name: Publish images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (immutable in ECR), e.g. v2"
        required: true

permissions:
  contents: read
  id-token: write  # lets the workflow request an OIDC token for AWS

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm  # native arm64: no slow emulation
    timeout-minutes: 30
    strategy:
      matrix:
        image:
          - { name: api, dockerfile: infra/api/Dockerfile, context: . }
          - { name: pipeline, dockerfile: infra/pipeline/Dockerfile, context: . }
          - { name: mlflow, dockerfile: infra/mlflow/Dockerfile, context: infra/mlflow }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-west-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/retention-${{ matrix.image.name }}:${{ inputs.tag }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
